<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change order continue-payment browser fixture</title>
  <style>
    html, body { margin: 0; min-height: 100%; font-family: system-ui, sans-serif; }
    iframe { display: block; width: min(100%, 390px); height: 100vh; border: 0; }
  </style>
</head>
<body>
  <iframe id="viewer" title="Synthetic change order viewer" src="../interactive-quote-viewer.html?quote_studio=1"></iframe>
  <script>
    const viewer = document.getElementById('viewer');
    const quote = {
      quoteNumber: 'SYNTHETIC-CO-1',
      parentQuoteNumber: 'SYNTHETIC-Q-1',
      changeOrderNumber: 1,
      documentType: 'change_order',
      status: 'approved',
      clientName: 'Synthetic Client',
      quoteTitle: 'Continue-work payment regression',
      parentQuoteTotal: 5950.24,
      changeOrderContext: { parentTotal: 5950.24, previousApprovedTotal: 0, projectPaidCents: 297512 },
      changeOrderContinuePayment: { version: 1, required: true, amount_cents: 50000 },
      change_order_payment_paid_cents: 20000,
      rooms: [{
        name: 'Added work',
        items: [{ id: 'added-work-1', name: 'Additional approved work', quantity: 1, unitType: 'each', rate: 895, total: 895 }]
      }],
      taxEnabled: true,
      taxRate: 0.13,
      taxLabel: 'HST',
      currency: 'CAD',
      payment_terms: { version: 2, deposit_required: false, kind: 'none', percent: null, fixed_cents: null },
      terms: ['Synthetic browser fixture only.'],
      style: { showUpgrades: true, approvalMode: 'accept' }
    };
    function render() {
      viewer.contentWindow.postMessage({
        type: 'quotedr-quote-studio-document', version: 1, quote, style: quote.style
      }, window.location.origin);
    }
    window.addEventListener('message', event => {
      if (event.origin === window.location.origin && event.data && event.data.type === 'quotedr-quote-studio-ready') render();
    });
  </script>
</body>
</html>
