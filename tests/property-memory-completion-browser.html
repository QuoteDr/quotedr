<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Property Memory Completion - Synthetic QA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <style>
    body { background: #f4f7fb; }
    .qa-shell { max-width: 940px; margin: 0 auto; }
    .property-memory-entry { min-height: 32px; }
    .property-memory-section { margin: 0; padding: 0 0 1.25rem; border: 0; border-bottom: 1px solid #dee2e6; }
    .property-memory-section + .property-memory-section { padding-top: 1.25rem; }
    .property-memory-section:last-child { border-bottom: 0; padding-bottom: 0; }
    .property-memory-section legend { float: none; width: auto; margin: 0 0 .75rem; font-size: 1rem; font-weight: 800; color: #0f3460; }
    .property-memory-contact-grid { display: grid; grid-template-columns: minmax(110px,.65fr) repeat(3,minmax(150px,1fr)); gap: .5rem; align-items: center; margin-bottom: .65rem; }
    .property-memory-additional-contact { grid-template-columns: minmax(120px,.8fr) repeat(3,minmax(140px,1fr)) auto; padding: .75rem; border: 1px solid #dee2e6; border-radius: .5rem; }
    .property-memory-reminder-alert { border-left: 4px solid #d18b23; }
    @media (max-width: 767.98px) {
      .property-memory-contact-grid { grid-template-columns: 1fr; gap: .35rem; padding: .75rem 0; border-bottom: 1px solid #e9ecef; }
      .property-memory-contact-head { display: none; }
      .property-memory-additional-contact { grid-template-columns: minmax(0,1fr); padding: .75rem; }
      #propertyMemoryManagerModal .btn, #propertyMemoryModal .modal-footer .btn { min-height: 44px; }
      #propertyMemoryModal .modal-footer { align-items: stretch; }
    }
  </style>
</head>
<body>
  <main class="qa-shell p-3 p-md-4">
    <div class="alert alert-secondary small">Synthetic local QA only. No production services or customer data are used.</div>
    <section class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4">Quote Builder property context</h1>
        <label class="form-label fw-bold" for="projectAddress">Project Address</label>
        <input id="projectAddress" class="form-control" value="123 Main Street, Toronto, ON">
        <div class="property-memory-entry d-flex flex-wrap align-items-center gap-2 mt-2">
          <button type="button" class="btn btn-sm btn-outline-primary d-inline-flex align-items-center gap-2" id="propertyMemoryBtn" aria-haspopup="dialog" aria-controls="propertyMemoryModal" aria-describedby="propertyMemoryAddressStatus" disabled>
            <i class="fas fa-house-circle-check" aria-hidden="true"></i><span>Property memory</span><span class="badge bg-primary" id="propertyMemorySavedBadge" hidden>Saved</span>
          </button>
          <button type="button" class="btn btn-sm btn-outline-secondary d-inline-flex align-items-center gap-2" id="managePropertyMemoryBtn" aria-haspopup="dialog" aria-controls="propertyMemoryManagerModal">
            <i class="fas fa-list" aria-hidden="true"></i><span>Manage Property Memory</span>
          </button>
          <span class="small text-muted" id="propertyMemoryAddressStatus" aria-live="polite"></span>
        </div>
        <div id="propertyMemoryReminderArea" hidden aria-live="polite"></div>
        <hr>
        <div class="small text-muted">Synthetic quote context: one Electrical line item; room markup remains 9%.</div>
        <pre id="qaPricingState" class="bg-light border rounded p-2 mt-2 mb-0"></pre>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    var rooms = [{ id: 1, name: 'Kitchen', markup: 9, items: [{ category: 'Electrical', description: 'Install receptacle', quantity: 2, rate: 125, total: 250 }] }];
    var pricingDatabase = {
      Electrical: [{ name: 'Install receptacle' }, { name: 'Panel upgrade' }],
      Cabinetry: [{ name: 'Vanity Installation' }]
    };
    var customItems = {};
    var syntheticUser = { id: 'synthetic-owner' };
    var syntheticRows = [
      {
        key: 'property_memory:123%20main%20st%20toronto%20on',
        updated_at: '2026-08-10T12:00:00.000Z',
        value: {
          version: 1,
          normalizedAddress: '123 main st toronto on',
          displayAddress: '123 Main Street, Toronto, ON',
          generalSiteNotes: 'Use the rear entrance and protect the original floors.',
          propertyContacts: { manager: { name: 'Synthetic Manager', phone: '555-0100', email: 'manager@example.test' } },
          workHistory: 'Synthetic kitchen repair completed in 2025.',
          reminders: [{ id: 'synthetic-electrical', label: 'Confirm panel access', message: 'Confirm panel access before electrical work begins.', targetType: 'category', category: 'Electrical' }],
          markupRule: { percent: 12, note: 'Review only', alwaysApply: false },
          updatedAt: '2026-08-10T12:00:00.000Z'
        }
      },
      {
        key: 'property_memory:9%20side%20rd%20toronto%20on',
        updated_at: '2026-08-09T12:00:00.000Z',
        value: {
          version: 1,
          normalizedAddress: '9 side rd toronto on',
          displayAddress: '9 Side Road, Toronto, ON',
          generalSiteNotes: 'Synthetic condo loading instructions.',
          propertyContacts: {}, reminders: [], markupRule: { percent: null, alwaysApply: false }
        }
      }
    ];

    function syntheticQuery() {
      var filters = {};
      var likePrefix = '';
      function rows() {
        return syntheticRows.filter(function(row) {
          if (filters.key && row.key !== filters.key) return false;
          if (likePrefix && row.key.indexOf(likePrefix) !== 0) return false;
          return true;
        });
      }
      var query = {
        select: function() { return query; },
        eq: function(column, value) { filters[column] = value; return query; },
        like: function(column, value) { if (column === 'key') likePrefix = String(value || '').replace(/%$/, ''); return query; },
        maybeSingle: function() { return Promise.resolve({ data: rows()[0] || null, error: null }); },
        then: function(resolve, reject) { return Promise.resolve({ data: rows(), error: null }).then(resolve, reject); }
      };
      return query;
    }

    window._supabase = { from: function() { return syntheticQuery(); } };
    window.getCurrentUser = async function() { return syntheticUser; };
    window.saveUserDataValue = async function(key, value) {
      var existing = syntheticRows.find(function(row) { return row.key === key; });
      if (existing) existing.value = JSON.parse(JSON.stringify(value));
      else syntheticRows.push({ key: key, value: JSON.parse(JSON.stringify(value)), updated_at: new Date().toISOString() });
      return { state: 'cloud_saved', error: null };
    };
    window.qdDurableSupabaseOperation = async function(operation) {
      if (operation.action === 'delete') syntheticRows = syntheticRows.filter(function(row) { return row.key !== operation.entityId; });
      return { state: 'cloud_saved', error: null };
    };
    window.qdConfirm = async function() { return true; };
    window.qdAlert = async function(message) { window.alert(message); };
    window.saveSessionQuote = function() {};
    window.markUnsaved = function() {};
    window.showToast = function() {};
    document.getElementById('qaPricingState').textContent = JSON.stringify({ markup: rooms[0].markup, quantity: rooms[0].items[0].quantity, total: rooms[0].items[0].total }, null, 2);
  </script>
  <script src="../property-memory.js"></script>
</body>
</html>
