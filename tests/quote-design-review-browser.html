<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quote design review test</title><link rel="stylesheet" href="/portal-designs.css"><style>body{font:16px system-ui;margin:24px}button,input,select{font:inherit;padding:10px;margin:5px}label{display:block}</style>
<h1>Local quote / design review</h1><p>No cloud writes. Synthetic quote and rendering.</p><div id="library"></div><button id="client">Test client quote</button><p id="result">Quote price hidden</p><pre id="events"></pre>
<script type="module">
import {mountDesignLibrary} from '/portal-designs.js';
import {reviewBeforeQuote,addAttachedDesignButton} from '/quote-design-review.js';
const design={id:'one',title:'Closet concept',project:'Bedroom',version:'1',kind:'interactive',visible:true,updated_at:'v1',revision:'r1',locked:true};let attachments=[];
const photo={...design,id:'photo',title:'Photo render',kind:'image',has_thumbnail:true,revision:'r2'};
const thumbnail='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=';
const request=async p=>{if(p.action==='list')return {designs:[design,photo],attachments};if(p.action==='thumbnail')return {mime:'image/png',base64:thumbnail};if(p.action==='attach_quote'){attachments=[{document_id:p.documentId,design_id:p.designIds[0],design_ids:p.designIds,require_review:p.requireReview,updated_at:'r1'}];return {ok:true};}throw Error('Disabled');};
mountDesignLibrary(document.querySelector('#library'),{isOwner:true,request,getQuotes:()=>[{id:'q',quote_number:'Q-001',type:'quote',data:{quoteTitle:'Closet quote'}}]}).refresh();
const reviewRequest=async p=>{document.querySelector('#events').textContent+=JSON.stringify(p)+'\n';if(p.operation==='open')return {kind:'interactive',mime:'text/html',base64:btoa('<h1>Closet concept</h1><button onclick="this.textContent=\'Door open\'">Slide door</button>')};return {ok:true};};
document.querySelector('#client').onclick=async()=>{try{const review={...design,designs:[photo,design]};await reviewBeforeQuote(review,reviewRequest);document.querySelector('#result').textContent='Quote unlocked: $5,847.75';addAttachedDesignButton(review,reviewRequest);}catch(e){document.querySelector('#result').textContent=e.message;}};
</script></html>
