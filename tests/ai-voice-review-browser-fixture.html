<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Voice Review Fixture</title>
  <style>
    html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; }
  </style>
</head>
<body>
  <iframe id="builderFixture" title="QuoteDr AI Voice Review fixture"></iframe>
  <script>
    (function() {
      var transcript = 'Trim up a five-foot exterior door.';
      var savedItems = {
        'DOORS & TRIM': [
          { name: '2-3/4\" Trim (painted)', unitType: 'LF', rate: 9.45 },
          { name: 'Exterior Door Trim Package', unitType: 'each', rate: 425 }
        ]
      };
      var rules = [
        {
          id: 'generic-door-rule',
          trigger_phrase: 'trim up a door',
          mapped_item_category: 'DOORS & TRIM',
          mapped_item_name: '2-3/4\" Trim (painted)',
          mapped_unit: 'LF',
          mapped_price: 9.45,
          quantity_mode: 'per_count',
          quantity_value: 35,
          count_unit_label: 'door',
          default_count: 1,
          usage_count: 250,
          active: true
        },
        {
          id: 'specific-door-rule-words',
          trigger_phrase: 'trim up a five-foot exterior door',
          mapped_item_category: 'DOORS & TRIM',
          mapped_item_name: '2-3/4\" Trim (painted)',
          mapped_unit: 'LF',
          mapped_price: 9.45,
          quantity_mode: 'fixed',
          quantity_value: 50,
          count_unit_label: 'door',
          default_count: 1,
          usage_count: 0,
          active: true
        },
        {
          id: 'specific-door-rule-number',
          trigger_phrase: 'trim up a 5 foot exterior door',
          mapped_item_category: 'DOORS & TRIM',
          mapped_item_name: 'Exterior Door Trim Package',
          mapped_unit: 'each',
          mapped_price: 425,
          quantity_mode: 'fixed',
          quantity_value: 1,
          count_unit_label: 'door',
          default_count: 1,
          usage_count: 0,
          active: true
        }
      ];

      localStorage.setItem('ald_custom_items', JSON.stringify(savedItems));
      localStorage.setItem('ald_builder_guide_hidden', '1');

      var frame = document.getElementById('builderFixture');
      frame.addEventListener('load', function() {
        var app = frame.contentWindow;
        if (!app || typeof app._applyAiTradeRulesToVoiceResult !== 'function') return;
        app.getUserAiTradeRules = async function() { return rules; };
        app.getUserLearnedMappings = async function() { return []; };
        app.incrementAiTradeRuleUsage = async function() { return { data: {} }; };
        app.saveLearnedMapping = async function() { return { data: { usage_count: 1 } }; };
        app.applyAIQuote = function(result) { app.__fixtureAppliedResult = result; };
        app._voiceOriginalTranscript = transcript;

        var parsed = {
          rooms: [{
            name: 'Exterior Door Area',
            items: [{
              category: 'DOORS & TRIM',
              description: '2-3/4\" Trim (painted)',
              quantity: 35,
              unit: 'LF',
              rate: 9.45,
              spokenPhrase: 'Trim up a door'
            }]
          }]
        };

        app._applyAiTradeRulesToVoiceResult(parsed, transcript, [])
          .then(function(result) { return app.showAiVoiceReview(result, []); })
          .catch(function(error) {
            document.body.setAttribute('data-fixture-error', error && error.message ? error.message : String(error));
          });
      });
      frame.src = '../quote-builder.html';
    })();
  </script>
</body>
</html>
