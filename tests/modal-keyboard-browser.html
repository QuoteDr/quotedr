<!doctype html><html><head><title>Isolated modal keyboard check</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"></head><body>
<button onclick="bootstrap.Modal.getOrCreateInstance(document.getElementById('testModal')).show()">Open test quote</button>
<p id="result">No submissions</p>
<div class="modal fade" id="testModal" tabindex="-1" data-initial-focus="#clientName" data-enter-submit="#create"><div class="modal-dialog"><div class="modal-content"><div class="modal-body">
<label for="clientName">Client Name</label><input id="clientName" type="text"><label for="notes">Notes</label><textarea id="notes"></textarea>
<button id="create" onclick="document.getElementById('result').textContent='Submitted: '+document.getElementById('clientName').value;bootstrap.Modal.getInstance(document.getElementById('testModal')).hide()">Create &amp; Open Builder</button>
<button data-bs-dismiss="modal">Cancel</button></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script><script src="../quote-dialogs.js"></script>
<script>document.addEventListener('keydown',window.qdModalEnterSubmit);</script></body></html>
