    <style>
        body {
            background: linear-gradient(135deg, #1a56a0 0%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 0 2.5rem 2.5rem 2.5rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 420px;
        }
        .back-to-site { margin: 0; line-height: 1.25; text-align: left; }
        .logo-area {
            text-align: center;
            margin-bottom: 0.5rem;
            overflow: hidden;
        }
        .logo-area img { width: 110%; max-width: 380px; height: auto; display: block; margin: -24% auto -39%; }
        .logo-area h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1a56a0, #0f3460);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-area p { color: #666; margin: 0; font-size: 0.9rem; }
        .btn-primary {
            background: linear-gradient(135deg, #1a56a0, #0f3460);
            border: none;
            padding: 0.75rem;
            font-weight: 600;
        }
        .btn-primary:hover { background: linear-gradient(135deg, #154a8a, #0d2d50); }
        .signin-heading { margin: 0 0 1.4rem; text-align: center; }
        .signin-heading h1 { margin: 0; color: #0f3460; font-size: 1.45rem; font-weight: 800; letter-spacing: 0; }
        .signin-heading p { margin: 0.4rem 0 0; color: #64748b; font-size: 0.9rem; }
        .early-access-link { margin-top: 1rem; text-align: center; font-size: 0.88rem; }
        .alert { margin-top: 1rem; }
        .input-group .btn-outline-secondary { border-color: #dee2e6; color: #666; }
        .input-group .btn-outline-secondary:hover { background: #f8f9fa; color: #333; }
        .form-control:focus { border-color: #1a56a0; box-shadow: 0 0 0 0.2rem rgba(26,86,160,0.25); }
        a { color: #1a56a0; }
    </style>

if (location.search.includes('debug')) {
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/eruda';

<body>
    <div class="login-card">
        <div class="back-to-site">
            <a href="landing.html" style="color:#1a56a0; font-size:0.9rem; font-weight:600; text-decoration:none;">← Back to Site</a>
        </div>
        <div class="logo-area">
            <img src="quotedr-logo.svg" alt="QuoteDr">
            <p id="loginTagline"></p>
            <script>
                const taglines = [
                    "Dr. Quotes will see you now 🩺",
                    "No waiting room. No co-pay. Just quotes.",
                    "Second opinion? Our quotes speak for themselves.",
                    "Prescribing profitable quotes since day one",
                    "The doctor is in. Your quote is ready.",
                    "Side effects may include: getting paid faster",
                    "Because napkin math wasn't cutting it anymore",
                    "Measure twice, quote once",
                    "Your foreman said get organized. Here you go.",
                    "Finally, software that doesn't require a PhD to operate",
                    "Less time quoting, more time on the tools",
                    "Built for people who actually build things",
                    "We handle the paperwork. You handle the drywall.",
                    "Your accountant will love you. Your competition won't.",
                    "No hard hat required 🦺",
                    "Turns out you CAN teach a contractor new tricks",
                    "Send a quote before they change their mind",
                    "Professional quotes. Professional prices. Professional you.",
                    "Look more legit than your competition in 5 minutes",
                    "Clients pay faster when the quote looks this good",
                    "Stop leaving money on the table (it's a job site, there is no table)"
                ];
                // Load or create shuffled order
                var order = JSON.parse(localStorage.getItem('ald_tagline_order') || 'null');
                if (!order || order.length !== taglines.length) {
                    // Fisher-Yates shuffle
                    order = taglines.map(function(_,i){ return i; });
                    for (var i = order.length - 1; i > 0; i--) {
                        var j = Math.floor(Math.random() * (i + 1));
                        var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
                    }
                    localStorage.setItem('ald_tagline_order', JSON.stringify(order));
                }
                var idx = parseInt(localStorage.getItem('ald_tagline_idx') || '0');
                document.getElementById('loginTagline').textContent = taglines[order[idx]];
                var nextIdx = idx + 1;
                if (nextIdx >= taglines.length) {
                    // Reshuffle for next cycle
                    nextIdx = 0;
                    localStorage.removeItem('ald_tagline_order');
                }
                localStorage.setItem('ald_tagline_idx', nextIdx);
            </script>
        </div>

        <div class="signin-heading">
            <h1>Existing Member Sign In</h1>
            <p>Use the account you already created.</p>
        </div>

        <!-- Sign In Form -->
        <form id="signinForm">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="signinEmail" placeholder="you@example.com">
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="signinPassword" placeholder="Enter your password">
                    <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('signinPassword', this)" tabindex="-1">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="text-end mb-3">
                <a href="#" onclick="handleForgotPassword(); return false;" style="font-size:0.85rem; text-decoration:none;">Forgot password?</a>
            </div>
            <div class="mb-3 d-flex align-items-center gap-2">
                <input class="form-check-input" type="checkbox" id="rememberMe" style="cursor:pointer;">
                <label class="form-check-label text-muted" for="rememberMe" style="font-size:0.9rem;">Remember me</label>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="signinBtn">Sign In</button>
            <div id="signinMessage"></div>
        </form>
        <div class="early-access-link">
            New to QuoteDr? <a href="login.html?signup=1" data-qd-signup-source="login_early_access">View early access details</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-v2.js?v=2026080102"></script>
    <script>
        // _supabase, SUPABASE_URL, SUPABASE_ANON_KEY are provided by supabase-v2.js

        // Only auto-redirect if URL has ?redirect=1 (i.e. came here intentionally, not directly)
        const urlParams = new URLSearchParams(window.location.search);
        if (!urlParams.has('noredirect')) {
            _supabase.auth.getSession().then(async ({ data: { session } }) => {
                if (session) {
                    // Check localStorage first (fast path)
                    if (localStorage.getItem('ald_onboarding_complete')) {
                        window.location.href = 'quote-builder.html';
                        return;
                    }
                    // Check Supabase for onboarding_complete (cross-device, key/value store)
                    try {
                        const { data: kvRow } = await _supabase
                            .from('user_data')
                            .select('value')
                            .eq('user_id', session.user.id)
                            .eq('key', 'onboarding_complete')
                            .maybeSingle();
                        if (kvRow && kvRow.value && kvRow.value.complete) {
                            localStorage.setItem('ald_onboarding_complete', '1');
                            window.location.href = 'quote-builder.html';
                        } else {
                            // Double-check: if they have existing quotes, they're not new — skip onboarding
                            const { data: existingQuotes } = await _supabase
                                .from('quotes')
                                .select('id')
                                .eq('user_id', session.user.id)
                                .neq('quote_number', '__ITEMS_BACKUP__')
                                .limit(1);
                            if (existingQuotes && existingQuotes.length > 0) {
                                localStorage.setItem('ald_onboarding_complete', '1');
                                window.location.href = 'quote-builder.html';
                            } else {
                                window.location.href = 'onboarding.html';
                            }
                        }
                    } catch(e) {
                        // If Supabase check fails, go to builder (safer than onboarding which can wipe items)
                        console.warn('Onboarding check failed, going to builder:', e);
                        window.location.href = 'quote-builder.html';
                    }
                }
            });
        }

        function showMessage(elId, msg, type) {
            document.getElementById(elId).innerHTML = '<div class="alert alert-' + (type || 'danger') + '">' + msg + '</div>';
        }

        function togglePassword(inputId, btn) {
            var input = document.getElementById(inputId);
            var icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function setLoading(btnId, loading) {
            var btn = document.getElementById(btnId);
            if (!btn) return;
            btn.disabled = loading;
            btn.innerHTML = loading
                ? '<span class="spinner-border spinner-border-sm me-2"></span>Please wait...'
                : 'Sign In';
        }

        // Brute force protection — 5 attempts per session, 15 min lockout
        var _loginAttempts = parseInt(sessionStorage.getItem('ald_login_attempts') || '0');
        var _lockoutUntil = parseInt(sessionStorage.getItem('ald_lockout_until') || '0');

        function _checkLockout() {
            _lockoutUntil = parseInt(sessionStorage.getItem('ald_lockout_until') || '0');
            if (_lockoutUntil && Date.now() < _lockoutUntil) {
                var secsLeft = Math.ceil((_lockoutUntil - Date.now()) / 1000);
                var minsLeft = Math.ceil(secsLeft / 60);
                showMessage('signinMessage', 'Too many failed attempts. Try again in ' + minsLeft + ' minute' + (minsLeft !== 1 ? 's' : '') + '.');
                document.getElementById('signinBtn').disabled = true;
                return true;
            }
            // Lockout expired — reset
            if (_lockoutUntil && Date.now() >= _lockoutUntil) {
                sessionStorage.removeItem('ald_login_attempts');
                sessionStorage.removeItem('ald_lockout_until');
                _loginAttempts = 0;
                document.getElementById('signinBtn').disabled = false;
            }
            return false;
        }

        function _recordFailedAttempt() {
            _loginAttempts = parseInt(sessionStorage.getItem('ald_login_attempts') || '0') + 1;
            sessionStorage.setItem('ald_login_attempts', _loginAttempts);
            if (_loginAttempts >= 5) {
                var until = Date.now() + 15 * 60 * 1000; // 15 min
                sessionStorage.setItem('ald_lockout_until', until);
                _checkLockout();
            } else {
                var remaining = 5 - _loginAttempts;
                showMessage('signinMessage', 'Incorrect email or password. ' + remaining + ' attempt' + (remaining !== 1 ? 's' : '') + ' remaining.');
            }
        }

        async function handleSignIn() {
            if (_checkLockout()) return;

            var email = document.getElementById('signinEmail').value.trim();
            var password = document.getElementById('signinPassword').value;
            if (!email || !password) { showMessage('signinMessage', 'Please fill in all fields.'); return; }
            
            // Save credentials if remember me is checked
            var rememberMe = document.getElementById('rememberMe');
            if (rememberMe && rememberMe.checked) {
                localStorage.setItem('ald_remembered_email', email);
                localStorage.setItem('ald_remember_me', 'true');
            } else {
                localStorage.removeItem('ald_remembered_email');
                localStorage.removeItem('ald_remember_me');
            }
            
            setLoading('signinBtn', true);
            var result = await _supabase.auth.signInWithPassword({ email: email, password: password });
            setLoading('signinBtn', false);
            if (result.error) {
                _recordFailedAttempt();
                return;
            }
            // Successful login — clear attempt counters
            sessionStorage.removeItem('ald_login_attempts');
            sessionStorage.removeItem('ald_lockout_until');
            // Preload items + clients into localStorage before redirect
            await preloadUserData(result.data.user);
            // Check onboarding from Supabase (source of truth)
            await checkOnboardingAndRedirect(result.data.user);
        }

        async function checkOnboardingAndRedirect(user) {
            try {
                const { data } = await _supabase
                    .from('user_data')
                    .select('value')
                    .eq('user_id', user.id)
                    .eq('key', 'onboarding_complete')
                    .maybeSingle();
                if (data && data.value && data.value.complete) {
                    localStorage.setItem('ald_onboarding_complete', '1');
                    window.location.href = 'quote-builder.html';
                    return;
                }
            } catch(e) { console.warn('Onboarding check error:', e); }
            // Fallback: if they have existing quotes, skip onboarding
            try {
                const { data: existingQuotes } = await _supabase
                    .from('quotes')
                    .select('id')
                    .eq('user_id', user.id)
                    .neq('quote_number', '__ITEMS_BACKUP__')
                    .limit(1);
                if (existingQuotes && existingQuotes.length > 0) {
                    localStorage.setItem('ald_onboarding_complete', '1');
                    window.location.href = 'quote-builder.html';
                    return;
                }
            } catch(e) { console.warn('Quotes fallback check error:', e); }
            window.location.href = 'onboarding.html';
        }

        async function preloadUserData(user) {
            try {
                if (typeof loadItemsFromSupabase === 'function') {
                    const r = await loadItemsFromSupabase();
                    if (r.data && Object.keys(r.data).length > 0) {
                        localStorage.setItem('ald_custom_items', JSON.stringify(r.data));
                        console.log('Items preloaded:', Object.keys(r.data).length, 'categories');
                    }
                }
                if (typeof loadClientsFromSupabase === 'function') {
                    const r = await loadClientsFromSupabase();
                    if (r.data && r.data.length > 0) {
                        // Convert array to object keyed by name (format the app expects)
                        const clientsObj = {};
                        (r.data || []).forEach(c => { if (c.name) clientsObj[c.name] = c; });
                        localStorage.setItem('ald_clients', JSON.stringify(clientsObj));
                        console.log('Clients preloaded:', Object.keys(clientsObj).length, 'clients');
                    }
                }
            } catch(e) { console.warn('Preload error:', e); }
        }

        async function handleForgotPassword() {
            var email = document.getElementById('signinEmail').value.trim();
            if (!email) { showMessage('signinMessage', 'Enter your email above first, then click Forgot password.', 'warning'); return; }
            var result = await _supabase.auth.resetPasswordForEmail(email);
            if (result.error) { showMessage('signinMessage', result.error.message); return; }
            showMessage('signinMessage', 'Password reset email sent! Check your inbox.', 'success');
        }

        // Check lockout state on page load (refresh shouldn't bypass it)
        _checkLockout();

        // Pre-fill remembered email
        if (localStorage.getItem('ald_remember_me') === 'true') {
            var rememberedEmail = localStorage.getItem('ald_remembered_email');
            if (rememberedEmail) {
                var emailEl = document.getElementById('signinEmail');
                if (emailEl) emailEl.value = rememberedEmail;
            }
            var rememberEl = document.getElementById('rememberMe');
            if (rememberEl) rememberEl.checked = true;
        }

        document.getElementById('signinForm').addEventListener('submit', function(event) {
            event.preventDefault();
            handleSignIn();
        });
    </script>
<script src="signup-gate.js?v=20260713"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW reg failed:', err));
