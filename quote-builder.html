        async function showAiVoiceReview(result) {
            if (!result || !Array.isArray(result.rooms)) {
                applyAIQuote(result);
                return;
            }
            console.log('[QuoteDr AI Voice] Opening review for parse result:', result);
            var mappings = [];
            if (typeof getUserLearnedMappings === 'function') {
                try { mappings = await getUserLearnedMappings(); } catch(e) { mappings = []; }
            }
            _voiceReviewResult = result;
            _voiceReviewItems = _flattenVoicePricingItems();
            _voiceReviewRows = _buildVoiceReviewRows(result, mappings);
            _renderAiVoiceScopeNotesReview();
            _renderAiVoiceReviewModal();
            var reviewModalEl = document.getElementById('aiVoiceReviewModal');
            if (!reviewModalEl) {
                throw new Error('AI voice review modal is missing from the page');
            }
            try {
                if (window.bootstrap) {
                    new bootstrap.Modal(reviewModalEl).show();
                } else {
                    _forceOpenAiVoiceReviewModal();
                }
            } catch(e) {
                console.warn('[QuoteDr AI Voice] Bootstrap modal failed, forcing review open:', e);
                _forceOpenAiVoiceReviewModal();
            }
            setTimeout(function() {
                if (!reviewModalEl.classList.contains('show')) {
                    console.warn('[QuoteDr AI Voice] Review modal was not visible after show; forcing it open.');
                    _forceOpenAiVoiceReviewModal();
                }
            }, 150);
            setTimeout(function() {
                if (typeof syncBuilderGuideWithAiVoiceReview === 'function') {
                    syncBuilderGuideWithAiVoiceReview();
                }
            }, 180);
        }

        function _hideBootstrapModalAndWait(modalId) {
            return new Promise(function(resolve) {
                var modalEl = document.getElementById(modalId);
                if (!modalEl || !window.bootstrap) {
                    resolve();
                    return;
                }
                var modal = bootstrap.Modal.getInstance(modalEl);
                if (!modal || !modalEl.classList.contains('show')) {
                    resolve();
                    return;
                }
                var settled = false;
                var timer = setTimeout(function() {
                    if (!settled) {
                        settled = true;
                        resolve();
                    }
                }, 450);
                modalEl.addEventListener('hidden.bs.modal', function() {
                    if (!settled) {
                        settled = true;
                        clearTimeout(timer);
                        resolve();
                    }
                }, { once: true });
                try { modal.hide(); } catch(e) {
                    clearTimeout(timer);
                    resolve();
                }
            });
        }

        function _forceOpenAiVoiceReviewModal() {
            var reviewModalEl = document.getElementById('aiVoiceReviewModal');
            if (!reviewModalEl) return;
            document.querySelectorAll('.modal-backdrop').forEach(function(backdrop) { backdrop.remove(); });
            reviewModalEl.style.display = 'block';
            reviewModalEl.removeAttribute('aria-hidden');
            reviewModalEl.setAttribute('aria-modal', 'true');
            reviewModalEl.setAttribute('role', 'dialog');
            reviewModalEl.classList.add('show');
            document.body.classList.add('modal-open');
            document.body.style.overflow = 'hidden';
            var backdrop = document.createElement('div');
            backdrop.className = 'modal-backdrop fade show';
            backdrop.setAttribute('data-ai-voice-review-backdrop', 'true');
            document.body.appendChild(backdrop);
        }

        function _forceCloseAiVoiceReviewModal() {
            var reviewModalEl = document.getElementById('aiVoiceReviewModal');
            if (!reviewModalEl) return;
            reviewModalEl.classList.remove('show');
            reviewModalEl.style.display = 'none';
            reviewModalEl.setAttribute('aria-hidden', 'true');
            reviewModalEl.removeAttribute('aria-modal');
            document.querySelectorAll('[data-ai-voice-review-backdrop="true"]').forEach(function(backdrop) { backdrop.remove(); });
            if (!document.querySelector('.modal.show')) {
                document.body.classList.remove('modal-open');
                document.body.style.overflow = '';
            }
        }

                var input = document.getElementById('aiVoiceReviewMatch' + index);
                var remember = document.getElementById('aiVoiceReviewRemember' + index);
                var note = document.querySelector('.ai-voice-review-note[data-row-index="' + index + '"]');
                var typedValue = input ? input.value : '';
                var confirmedExistingMapping = row.mapping && typedValue.trim().toLowerCase() === _voiceMappingDisplay(row.mapping).trim().toLowerCase();
                var selected = confirmedExistingMapping ? null : _resolveVoiceReviewSelection(typedValue);
                if (confirmedExistingMapping) {
                    _applyVoiceMappedItem(row.item, row.mapping);
                    _applyAiVoiceReviewQuantityEdit(row, index);
                    if (typeof incrementLearnedMappingUsage === 'function') {
                        saveTasks.push(incrementLearnedMappingUsage(row.mapping.id).catch(function(){}));
                    }
                } else if (selected) {
                    _applyVoiceMappedItem(row.item, selected);
                    _applyAiVoiceReviewQuantityEdit(row, index);
                    if (remember && remember.checked && typeof saveLearnedMapping === 'function') {
                        saveTasks.push(saveLearnedMapping(row.phrase || row.item.description, selected, note ? note.value.trim() : '').then(function(result) {
                            var uses = parseInt(result && result.data && result.data.usage_count, 10) || 0;
                            if (uses >= 2 && !row.item.aiTradeRuleId) ruleSuggestionCandidates.push({ row: row, selected: selected });
                            return result;
                        }).catch(function(e) {
                            console.warn('Could not save AI learned mapping:', e);
                        }));
                    }
                } else {
                    _applyAiVoiceReviewQuantityEdit(row, index);
                }
            });
            document.querySelectorAll('.ai-voice-scope-note').forEach(function(input) {
                var roomIndex = parseInt(input.getAttribute('data-room-index'), 10);
                var keep = document.getElementById('aiVoiceScopeKeep' + roomIndex);
                if (!_voiceReviewResult.rooms || !_voiceReviewResult.rooms[roomIndex]) return;
                _voiceReviewResult.rooms[roomIndex].scopeNotes = keep && keep.checked ? input.value.trim() : '';
            });
            await Promise.all(saveTasks);
            var modal = bootstrap.Modal.getInstance(document.getElementById('aiVoiceReviewModal'));
            if (modal) modal.hide();
            _forceCloseAiVoiceReviewModal();
            var reviewed = _voiceReviewResult;
            _voiceReviewResult = null;
            _voiceReviewRows = [];
            _removeExcludedAiVoiceItems(reviewed);
            applyAIQuote(reviewed);
            _maybeSuggestAiTradeRule(ruleSuggestionCandidates).catch(function(e) { console.warn('AI trade rule suggestion failed:', e); });
        }

        function _removeExcludedAiVoiceItems(result) {
            if (!result || !Array.isArray(result.rooms)) return result;
            result.rooms.forEach(function(room) {
                if (!room || !Array.isArray(room.items)) return;
                room.items = room.items.filter(function(item) { return !item._excludeFromQuote; });
            });
            result.rooms = result.rooms.filter(function(room) {
                return room && Array.isArray(room.items) && room.items.length > 0;
            });
            return result;
        }

        function skipAiVoiceReview() {
            var modal = bootstrap.Modal.getInstance(document.getElementById('aiVoiceReviewModal'));
            if (modal) modal.hide();
            _forceCloseAiVoiceReviewModal();
            var reviewed = _voiceReviewResult;
            _voiceReviewResult = null;
            _voiceReviewRows = [];
            applyAIQuote(reviewed);
        }

        async function submitVoiceQuote() {
            var transcript = _voiceTranscriptFull.trim();
            if (!transcript) return;
            _voiceRecording = false;
            _voicePaused = false;
            if (_voiceRecognition) {
                try { _voiceRecognition.abort(); } catch(e) {}
                _voiceRecognition = null;
            }
            _setVoicePauseButton(false);
            document.getElementById('voiceActions').style.display = 'none';
            document.getElementById('voiceLoading').style.display = 'block';
            document.getElementById('voiceStatus').textContent = 'AI is analyzing your description...';
            try {
                if (typeof getSupabaseFunctionAuthHeaders !== 'function') {
                    throw new Error('Please sign in again before using AI voice quote.');
                }
                const response = await fetch('https://axmoffknvblluibuitrq.supabase.co/functions/v1/parse-quote', {
                    method: 'POST',
                    headers: await getSupabaseFunctionAuthHeaders(),
                    body: JSON.stringify({
                        transcript: transcript,
                        customItems: (function() {
                            try { return JSON.parse(localStorage.getItem('ald_custom_items') || '{}'); } catch(e) { return {}; }
                        })(),
                        learnedMappings: (typeof getUserLearnedMappings === 'function') ? await getUserLearnedMappings() : []
                    })
                });
                if (!response.ok) throw new Error('Server error: ' + response.status);
                const result = await response.json();
                if (result.error) throw new Error(result.error);
                document.getElementById('voiceLoading').style.display = 'none';
                await _hideBootstrapModalAndWait('voiceQuoteModal');
                const templatedResult = await _applyAiVoiceTemplatesToResult(result, transcript);
                const ruledResult = await _applyAiTradeRulesToVoiceResult(templatedResult, transcript);
                const measuredResult = await showAiVoiceMeasurementModal(ruledResult);
                await showAiVoiceReview(measuredResult);
            } catch(err) {
                console.error('Voice quote error:', err);
                document.getElementById('voiceLoading').style.display = 'none';
                document.getElementById('voiceActions').style.display = 'block';
                document.getElementById('voiceStatus').textContent = 'Error: ' + err.message + '. Try again.';
                if (!document.getElementById('voiceQuoteModal')?.classList.contains('show')) {
                    qdAlert('AI Voice could not open the review step: ' + err.message);
                }
            }
        }

        async function _addPreparedAiVoiceRoomItems(aiRoom, targetRoom, aiAutoGroupDecision, aiRoomIndex) {
            if (!aiRoom || !targetRoom || !Array.isArray(aiRoom.items)) return;
            if (!Array.isArray(targetRoom.items)) targetRoom.items = [];
            for (let aiItemIndex = 0; aiItemIndex < aiRoom.items.length; aiItemIndex++) {
                var aiLineItem = aiRoom.items[aiItemIndex];
                var aiItemsToAdd = await resolveAiVoiceAutoGroupedItems(aiLineItem, aiAutoGroupDecision, aiRoomIndex, aiItemIndex);
                aiItemsToAdd.forEach(function(itemToAdd) {
                    targetRoom.items.push(itemToAdd);
                });
            }
        }

        function _createAiVoiceQuoteRoom(roomName, scopeNotes) {
            roomCounter++;
            var defaultColour = (typeof getDefaultRoomColour === 'function') ? getDefaultRoomColour(roomCounter) : { colorIndex: (roomCounter - 1) % ROOM_COLORS.length };
            return {
                id: roomCounter,
                name: roomName || 'Room ' + roomCounter,
                colorIndex: defaultColour.colorIndex !== undefined ? defaultColour.colorIndex : (roomCounter - 1) % ROOM_COLORS.length,
                customColor: defaultColour.customColor || '',
                colorIntensity: defaultColour.colorIntensity,
                scopeNotes: scopeNotes || '',
                items: [],
                autoGroupingEnabled: getDefaultRoomAutoGroupingEnabled()
            };
        }

        async function applyAIQuote(result) {
            if (!result.rooms || !Array.isArray(result.rooms)) {
                qdAlert('AI could not parse the quote. Please try again with more detail.');
                return;
            }
            var preparedAiRooms = normalizeAiVoiceQuoteRooms(result);
            var destination = await openAiVoiceDestinationModal(preparedAiRooms);
            if (!destination) {
                showToast('AI Voice result cancelled. No quote items were changed.', 'info');
                return;
            }
            var aiAutoGroupDecision = await prepareAiVoiceAutoGroupingDecision(preparedAiRooms);
            var targetRoom = null;
            if (destination.mode === 'parsed') {
                for (let parsedRoomIndex = 0; parsedRoomIndex < preparedAiRooms.length; parsedRoomIndex++) {
                    const parsedAiRoom = preparedAiRooms[parsedRoomIndex];
                    var parsedRoomName = (destination.roomNames && destination.roomNames[parsedRoomIndex]) || parsedAiRoom.name || ('Room ' + (parsedRoomIndex + 1));
                    var parsedTargetRoom = _createAiVoiceQuoteRoom(parsedRoomName, parsedAiRoom.scopeNotes || '');
                    rooms.push(parsedTargetRoom);
                    await _addPreparedAiVoiceRoomItems(parsedAiRoom, parsedTargetRoom, aiAutoGroupDecision, parsedRoomIndex);
                }
            } else if (destination.mode === 'existing') {
                targetRoom = rooms.find(function(room) { return room.id === destination.roomId; });
                if (!targetRoom) {
                    qdAlert('That room is no longer available. Nothing was added.');
                    return;
                }
                if (!Array.isArray(targetRoom.items)) targetRoom.items = [];
                var combinedNotes = _combinedAiVoiceScopeNotes(preparedAiRooms);
                if (combinedNotes) targetRoom.scopeNotes = [targetRoom.scopeNotes || '', combinedNotes].filter(function(note) { return String(note || '').trim(); }).join('\n\n');
            } else {
                targetRoom = _createAiVoiceQuoteRoom(destination.roomName || 'AI Voice Room', _combinedAiVoiceScopeNotes(preparedAiRooms));
                rooms.push(targetRoom);
            }
            if (targetRoom) {
                for (let aiRoomIndex = 0; aiRoomIndex < preparedAiRooms.length; aiRoomIndex++) {
                    const aiRoom = preparedAiRooms[aiRoomIndex];
                    await _addPreparedAiVoiceRoomItems(aiRoom, targetRoom, aiAutoGroupDecision, aiRoomIndex);
                }
            }
            renderRooms();
            calculateTotals();
            markUnsaved();
            var saveStatus = document.getElementById('saveStatus');
            if (saveStatus) saveStatus.innerHTML = '<span style="color:#7c3aed;"><i class="fas fa-magic"></i> AI quote generated - review and adjust prices!</span>';
            setTimeout(function() { if (saveStatus) saveStatus.innerHTML = ''; }, 5000);
        }

        initDone = true; // changes after this point are tracked


    </script>
